name: Expo Mobile — Smoke Test

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"

jobs:
  expo-smoke-test:
    name: Expo Export (Web) Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate Expo config
        working-directory: apps/mobile
        run: npx expo config --type introspect

      - name: Run Expo web export (smoke test)
        working-directory: apps/mobile
        run: npx expo export --platform web --output-dir /tmp/expo-web-out
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_API_URL: https://example.com/api

      - name: Confirm output exists
        run: ls /tmp/expo-web-out
